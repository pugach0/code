[bar/topmiddle]
width = 5%
height = 17pt
offset-x = 47.5%
radius = 4
background = #CCE03030
foreground = #FFFFFF
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 0
font-0 = "JetBrainsMono Nerd Font:size=11;2"
modules-center = toggl_timer
wm-restack = bspwm

[module/toggl_timer]
type = custom/script
exec = ~/.config/study_tracker/toggl-time.sh
interval = 1
label = %output%
label-foreground = #FFFFFF
